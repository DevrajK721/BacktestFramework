[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
description = "Backtesting framework for testing trading strategies"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
	{ name = "Devraj Katkoria", email = "devraj.katkoria@outlook.com" },
]
dependencies = [
	"numpy>=1.26",
	"pandas>=2.2",
	"matplotlib>=3.8",
]
[project.optional-dependencies]
dev = [
	"pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
